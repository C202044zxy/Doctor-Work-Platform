name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest -q && uv run ruff check app tests migrations && uv run ruff format --check app tests migrations
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - run: docker compose up --build --wait --wait-timeout 180
      - run: python3 scripts/smoke.py
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
