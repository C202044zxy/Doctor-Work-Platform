# Container mode. The local (no-Docker) mode is backend/start.ps1 on Windows and
# backend/start.sh on Linux/macOS; both use the same SQLite + Redis stack, so a
# container run and a local run behave the same.
#
# The database is SQLite, so there is no database server to start and no
# credentials to manage. Local development needs Redis only.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      # Four slashes: an absolute path inside the container, on the volume below.
      DATABASE_URL: sqlite:////data/doctor.db
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.test}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      PATIENT_DATA_KEY: ${PATIENT_DATA_KEY:-dev-only-insecure-patient-data-key}
    volumes:
      - sqlite_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 15
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  sqlite_data:
  redis_data:
