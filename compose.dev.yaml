name: doctor-work-dev
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:16379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - dev_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  dev_redis:
